<html>
    <head>
        <title>Nesting of Tables</title>
    </head>
    <body bgcolor="pink">
        <center>
            <h1>Nested tables</h1>
            <table border="1" cellpadding="3" cellspacing="3">
                <tr>
                <td>
                    <table border="2">
                        <tr>
                            <th>Mail sites</th>
                            <th>Study sites</th>
                        </tr>
                        <tr>
                            <td>Gmail.com</td>
                            <td>Geeksforgeeks.com</td>
                        </tr>
                        <tr>
                            <td>Yahoo.com</td>
                            <td>Byjus.com</td>
                        </tr>
                    </table>
                </td>
                <td>
                    <table border="2">
                        <tr>
                            <th>Number</th>
                            <th>Words</th>
                        </tr>
                        <tr>
                            <th>1</th>
                            <th>One</th>
                        </tr>
                        <tr>
                            <th>2</th>
                            <th>Two</th>
                        </tr>
                    </table>
                </td>
                </tr>
            </table>
        </center>
    </body>
</html>
